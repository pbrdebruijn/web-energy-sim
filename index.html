<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home energy simulator</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
:root {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --hair: #2c2c2a; --axis: #383835;
  --solar: #c98500; --home: #3987e5; --ev: #199e70; --batt: #9085e9; --grid: #d95926;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
main { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; height: 100vh; }
#stage { position: relative; overflow: hidden; min-height: 280px; }
#stage canvas { display: block; }
button { font: inherit; color: var(--ink); background: var(--axis); border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button:hover { background: #4a4a46; }
#charts { background: var(--surface); border-top: 1px solid var(--hair); padding: 10px 14px 6px; position: relative; }
#pop { position: absolute; z-index: 3; width: 300px; max-width: calc(100% - 16px); max-height: calc(100% - 16px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--axis); border-radius: 10px; padding: 0 14px 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
#pop h2 { border-top: 0; margin-top: 10px; padding-top: 0; }
.x { margin-left: auto; padding: 2px 8px; }
h2 label + .x { margin-left: 0; }
details.more { margin: 10px 0 4px; }
details.more summary { cursor: pointer; color: var(--ink2); font-size: 13px; }
details.more summary:hover { color: var(--ink); }
aside { background: var(--surface); border-left: 1px solid var(--hair); overflow-y: auto; height: 100vh; padding: 16px; }
h1 { font-size: 16px; margin: 0 0 12px; }
.share { display: inline-flex; align-items: center; gap: 6px; }
.share span:empty { display: none; }
aside .share { margin-bottom: 14px; }
h2 { font-size: 13px; margin: 18px 0 8px; padding-top: 14px; border-top: 1px solid var(--hair); color: var(--ink);
  display: flex; align-items: center; gap: 8px; }
h2 i { width: 10px; height: 10px; border-radius: 2px; }
h2 label { margin-left: auto; font-weight: 400; color: var(--ink2); }
.hero { font-size: 40px; font-weight: 650; line-height: 1.1; }
.hero small { display: block; font-size: 14px; font-weight: 400; color: var(--ink2); margin-top: 2px; }
.sub { color: var(--ink2); margin: 4px 0 10px; }
.bar { display: flex; gap: 2px; height: 14px; margin: 8px 0 6px; }
.bar span { border-radius: 3px; min-width: 2px; }
dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; margin: 0; color: var(--ink2); }
dd { margin: 0; color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; }
dt i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.tiles div { background: var(--page); border-radius: 8px; padding: 8px 10px; color: var(--ink2); font-size: 12px; }
.tiles b { display: block; font-size: 18px; color: var(--ink); }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 8px 0; color: var(--ink2); }
.row output { color: var(--ink); font-variant-numeric: tabular-nums; }
.row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--home); margin: 0; }
.row select { grid-column: 1 / -1; font: inherit; color: var(--ink); background: var(--page); border: 1px solid var(--axis);
  border-radius: 6px; padding: 5px; }
.check { display: flex; gap: 8px; margin: 8px 0; color: var(--ink2); }
.note { color: var(--muted); font-size: 12px; margin: 6px 0; }
#toggles, #closeSettings { display: none; }
@media (max-width: 900px) {
  body { display: block; }
  main { height: 100vh; height: 100dvh; }
  #stage { min-height: 200px; }
  #toggles { display: flex; gap: 6px; position: absolute; top: 12px; right: 12px; z-index: 2; }
  #toggles button { background: rgba(26, 26, 25, .88); border: 1px solid rgba(255, 255, 255, .1); padding: 8px 12px; }
  #toggles button[aria-expanded=true] { background: var(--axis); border-color: var(--ink2); }
  #charts { display: none; max-height: 55dvh; overflow-y: auto; }
  body.show-chart #charts { display: block; }
  aside { display: none; position: fixed; inset: 0; z-index: 5; border-left: 0; height: 100dvh; }
  body.show-settings aside { display: block; }
  h1 { display: flex; align-items: center; }
  #closeSettings { display: block; }
  #clock { left: 12px; bottom: 12px; }
}
</style>
</head>
<body>
<main>
  <div id="stage">
    <div id="clock" class="clock">
      <button id="play" aria-label="Pause">❚❚</button>
      <time id="time">00:00</time>
      <small id="now"></small>
      <button id="speed" aria-label="Playback speed">1x</button>
    </div>
    <div id="pop" role="dialog" hidden></div>
    <div id="toggles">
      <button data-panel="chart" aria-expanded="false" aria-controls="charts">Chart</button>
      <button data-panel="settings" aria-expanded="false" aria-controls="settings">Settings</button>
      <button class="share" aria-label="Share" title="Share a link that opens the simulator with these settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span></span></button>
    </div>
  </div>
  <section id="charts">
    <div id="legend" class="legend"></div>
    <svg id="chart" class="chart" role="img" aria-label="Price, power and charge level over the day"></svg>
    <div id="tip" class="tip"></div>
  </section>
</main>
<aside id="settings">
  <h1>Home energy simulator <button class="x" id="closeSettings" aria-label="Close settings">✕</button></h1>
  <button class="share" title="Share a link that opens the simulator with these settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span>Share</span></button>
  <div id="results"></div>
  <div id="controls"></div>
  <p class="note">Prices follow the Zonneplan dynamic tariff: hourly day-ahead price plus 21% VAT, €0.02 purchase fee and €0.1108 energy tax per kWh. Fixed delivery and grid operator costs are not included.</p>
</aside>
<script type="module" src="main.js"></script>
</body>
</html>
